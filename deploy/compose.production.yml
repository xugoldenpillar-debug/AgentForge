# Public web process only. The trusted runsc worker runs directly on the host.
# External PostgreSQL and Redis are required; secrets never appear in this file.
services:
  app:
    image: ${AGENTFORGE_IMAGE:?Set an immutable release image tag}
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ${AGENTFORGE_ENV_FILE:?Set an absolute production env file path}
    environment:
      # The trusted host worker uses DATABASE_URL/REDIS_URL from the shared env
      # file. The unprivileged web container reaches same-host dependencies via
      # the dedicated backend network using these explicitly paired URLs.
      DATABASE_URL: ${AGENTFORGE_WEB_DATABASE_URL:?Set the web-container PostgreSQL URL}
      REDIS_URL: ${AGENTFORGE_WEB_REDIS_URL:?Set the web-container Redis URL}
      NODE_ENV: production
      PORT: "3000"
      APP_ENV: production
      DEMO_MODE: "false"
      EVALUATION_SCHEDULER_MODE: "outbox"
      ARTIFACT_ARENA_ENABLED: "true"
      ARTIFACT_ARENA_KILL_SWITCH: "false"
      PI_RUNTIME_ENABLED: "true"
    command: ["node", "node_modules/next/dist/bin/next", "start", "--hostname", "0.0.0.0"]
    ports:
      - "127.0.0.1:${AGENTFORGE_HTTP_PORT:-53180}:3000"
    networks:
      - backend
    volumes:
      - ${ARTIFACT_STORAGE_ROOT:?Set ARTIFACT_STORAGE_ROOT}:${ARTIFACT_STORAGE_ROOT:?Set ARTIFACT_STORAGE_ROOT}:ro
    group_add:
      - "${ARTIFACT_STORAGE_GID:?Set ARTIFACT_STORAGE_GID}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    external: true
    name: agentforge-production-backend
