# Existing web application only. This does NOT enable animation creation.
# External PostgreSQL is required; secrets never appear in this file.
services:
  app:
    image: ${AGENTFORGE_IMAGE:?Set an immutable release image tag}
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ${AGENTFORGE_ENV_FILE:?Set an absolute production env file path}
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_ENV: production
      DEMO_MODE: "false"
      ARTIFACT_ARENA_ENABLED: "false"
      PI_RUNTIME_ENABLED: "false"
    command: ["node", "node_modules/next/dist/bin/next", "start", "--hostname", "0.0.0.0"]
    ports:
      - "127.0.0.1:${AGENTFORGE_HTTP_PORT:-53180}:3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
