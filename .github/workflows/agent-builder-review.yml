name: Agent builder review snapshot
on:
  push:
    branches: [feat/agent-builder-complete-20260908]
    paths: [.github/workflows/agent-builder-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/agentforge-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: agentforge-review-source
          path: ${{ runner.temp }}/agentforge-source.tar.gz
          retention-days: 1
