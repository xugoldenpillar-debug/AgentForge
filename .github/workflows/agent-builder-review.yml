name: Agent builder review snapshot
on:
  push:
    branches: [feat/agent-builder-complete-20260908]
    paths: [.github/workflows/agent-builder-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - name: Prepare locked package cache, not node_modules
        run: |
          pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store"
          corepack pack pnpm@10.15.1 -o "$RUNNER_TEMP/pnpm-cache.tgz"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/pnpm-store.tgz" pnpm-store
      - uses: actions/upload-artifact@v4
        with:
          name: agentforge-offline-packages
          path: |
            ${{ runner.temp }}/pnpm-cache.tgz
            ${{ runner.temp }}/pnpm-store.tgz
          retention-days: 1
