name: Agent builder full-stack validation
on:
  push:
    branches: [feat/agent-builder-complete-20260908]
    paths: [.github/workflows/agent-builder-apply.yml]
permissions:
  contents: write
concurrency:
  group: agent-builder-implementation-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DEMO_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentforge
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge_local
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentforge -d agentforge"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Verify exact reviewed patch and apply only to task branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = feat/agent-builder-complete-20260908
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/builder-evidence"
          for SHA in 8d7c311b61df6e49e6094691bf9c6ce908d60d01 70f7baeb6db66dd1cd522763ea5d62475e4ef0c9 d3147dc151609c84946c90402b636b66965e3722 0ad90e50f9f274c63cd808c5da90d7ef45f8eec1 5c6e1b1039449e6e0f4f91df75e7868356c8a4a9 701db9d818bccc57f5dbc171c43b35bdf3ac4806 2add215cbef8d43b2ec69dcf7e0ba195b5901e9c; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$SHA" --jq .content | base64 -d >> "$RUNNER_TEMP/builder.patch.xz"
          done
          xz -dc "$RUNNER_TEMP/builder.patch.xz" > "$RUNNER_TEMP/builder.patch"
          echo "58393cce53e5fbf4e2633043db098e6c6ab0f903c7b6e1b7e1cabd6dd532998c  $RUNNER_TEMP/builder.patch" | sha256sum -c -
          git apply --check --index "$RUNNER_TEMP/builder.patch"
          git apply --index "$RUNNER_TEMP/builder.patch"
          git diff --cached --check
          git diff --cached --stat
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - name: Regression suite including installed Pi runtime
        run: pnpm test | tee "$RUNNER_TEMP/builder-evidence/unit.log"
      - name: Migration and persistent database gates
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://agentforge:agentforge_local@127.0.0.1:5432/postgres
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          pnpm test:migrations | tee "$RUNNER_TEMP/builder-evidence/migrations.log"
          pnpm exec tsx --test tests/agent-drafts.integration.ts | tee "$RUNNER_TEMP/builder-evidence/drafts.log"
          pnpm test:evaluation-db | tee "$RUNNER_TEMP/builder-evidence/evaluation-db.log"
          pnpm db
      - name: Deployment, runtime and SDK gates
        run: |
          pnpm test:deploy | tee "$RUNNER_TEMP/builder-evidence/deploy.log"
          pnpm test:pi-runtime | tee "$RUNNER_TEMP/builder-evidence/pi-runtime.log"
          pnpm test:provider-sdk | tee "$RUNNER_TEMP/builder-evidence/provider-sdk.log"
      - name: Types and production build
        run: |
          pnpm typecheck | tee "$RUNNER_TEMP/builder-evidence/typecheck.log"
          pnpm build | tee "$RUNNER_TEMP/builder-evidence/build.log"
      - name: Isolated browser dependency (not an application dependency)
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-audit --no-fund --ignore-scripts playwright@1.58.2
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Real Next.js browser and normal/test smoke
        run: |
          BASE=http://127.0.0.1:3817
          mkdir -p "$RUNNER_TEMP/agentforge-artifacts"
          ARTIFACT_ARENA_ENABLED=true ARTIFACT_STORAGE_ROOT="$RUNNER_TEMP/agentforge-artifacts" BETTER_AUTH_URL="$BASE" pnpm exec next start -p 3817 > "$RUNNER_TEMP/builder-next.log" 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" || true' EXIT
          for i in $(seq 1 90); do
            if curl --fail --silent "$BASE/api/arena/boot" > /dev/null; then break; fi
            sleep 1
          done
          BUILDER_BROWSER_BASE_URL="$BASE" BUILDER_BROWSER_OUTPUT="$RUNNER_TEMP/builder-evidence/browser" PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs" node --experimental-strip-types scripts/agent-builder-browser.mjs | tee "$RUNNER_TEMP/builder-evidence/browser.log"
          SMOKE_BASE_URL="$BASE" SMOKE_EXPECT_TEST_MODE=true pnpm test:smoke | tee "$RUNNER_TEMP/builder-evidence/smoke-test.log"
          kill "$APP_PID"
          wait "$APP_PID" || true
          APP_ENV=development BETTER_AUTH_URL="$BASE" pnpm exec next start -p 3817 > "$RUNNER_TEMP/builder-next-normal.log" 2>&1 &
          APP_PID=$!
          for i in $(seq 1 90); do
            if curl --fail --silent "$BASE/api/arena/boot" > /dev/null; then break; fi
            sleep 1
          done
          SMOKE_BASE_URL="$BASE" SMOKE_EXPECT_TEST_MODE=false pnpm test:smoke | tee "$RUNNER_TEMP/builder-evidence/smoke-normal.log"
      - name: Commit verified implementation and remove task-only transport workflows
        run: |
          git diff --cached --check
          git diff --exit-code -- package.json pnpm-lock.yaml src/db/schema.ts src/db/schema.sql
          git rm .github/workflows/agent-builder-review.yml .github/workflows/agent-builder-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: complete agent builder model discovery and private Skill runtime integration'
          git push origin HEAD:refs/heads/feat/agent-builder-complete-20260908
          git rev-parse HEAD | tee "$RUNNER_TEMP/builder-evidence/implementation-sha.txt"
          git bundle create "$RUNNER_TEMP/builder-evidence/verified-source.bundle" --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-builder-validation-evidence
          path: ${{ runner.temp }}/builder-evidence
          retention-days: 7
