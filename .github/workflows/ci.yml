name: AgentForge checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentforge
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge_local
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentforge -d agentforge"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - name: Isolated PostgreSQL migration matrix
        run: pnpm test:migrations
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://agentforge:agentforge_local@127.0.0.1:5432/postgres
      - name: Agent draft PostgreSQL CAS and persistence
        run: pnpm exec tsx --test tests/agent-drafts.integration.ts
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://agentforge:agentforge_local@127.0.0.1:5432/postgres
      - name: Real PostgreSQL and BullMQ evaluation gate
        run: pnpm test:evaluation-db
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://agentforge:agentforge_local@127.0.0.1:5432/postgres
          REDIS_URL: redis://127.0.0.1:6379
      - run: pnpm db
      - run: pnpm test
      - run: pnpm test:pi-runtime
      - run: pnpm test:provider-sdk
      - run: pnpm typecheck
      - run: pnpm build
      - name: Normal and test-mode smoke against Next.js and PostgreSQL
        run: |
          for MODE in development test; do
            APP_ENV=$MODE DEMO_MODE=true node node_modules/next/dist/bin/next start > /tmp/agentforge-next.log 2>&1 &
            APP_PID=$!
            trap 'kill "$APP_PID" || true' EXIT
            for i in $(seq 1 60); do
              if curl --fail --silent http://localhost:3000/api/arena/boot > /dev/null; then break; fi
              sleep 1
            done
            if [ "$MODE" = test ]; then EXPECT=true; else EXPECT=false; fi
            SMOKE_EXPECT_TEST_MODE=$EXPECT pnpm test:smoke
            kill "$APP_PID"
            wait "$APP_PID" || true
            trap - EXIT
          done
